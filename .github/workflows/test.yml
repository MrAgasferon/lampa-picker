name: test

# Проверка плагина стендом из папки test/ при каждой загрузке файлов.
# Проверяется picker-dev.js, если он есть в репозитории, иначе picker.js.

on:
  push:
    paths:
      - 'picker.js'
      - 'picker-dev.js'
      - 'test/**'
      - '.github/workflows/test.yml'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: test/package-lock.json
      - name: Какой файл проверяем
        run: |
          if [ -f ../picker-dev.js ]; then echo "PICKER=$(realpath ../picker-dev.js)" >> "$GITHUB_ENV"; else echo "PICKER=$(realpath ../picker.js)" >> "$GITHUB_ENV"; fi
      - run: npm ci --no-audit --no-fund
      - name: Синтаксис
        run: node --check "$PICKER"
      - name: Проверки стенда
        run: echo "Проверяю $PICKER" && npm test
