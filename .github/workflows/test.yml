name: test

# Стенд из папки test/ на каждую загрузку файлов.
# 1. Сторож релиза: в picker.js версия без «-dev»; picker.js и picker-dev.js с одной версией не расходятся в коде.
# 2. Полный набор проверок — отдельно для picker.js и для picker-dev.js (если он есть).

on:
  push:
    paths:
      - 'picker.js'
      - 'picker-dev.js'
      - 'test/**'
      - '.github/workflows/test.yml'
  pull_request:
  workflow_dispatch:

jobs:
  release:
    name: Сторож релиза
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node test/release-check.js

  test:
    name: Стенд — ${{ matrix.file }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: [picker.js, picker-dev.js]
    defaults:
      run:
        working-directory: test
    steps:
      - uses: actions/checkout@v5
      - name: Есть ли файл
        id: has
        run: |
          if [ -f "../${{ matrix.file }}" ]; then
            echo "yes=1" >> "$GITHUB_OUTPUT"
            echo "PICKER=$(realpath ../${{ matrix.file }})" >> "$GITHUB_ENV"
          else
            echo "${{ matrix.file }} нет в репозитории — пропускаю"
          fi
      - uses: actions/setup-node@v5
        if: steps.has.outputs.yes == '1'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test/package-lock.json
      - if: steps.has.outputs.yes == '1'
        run: npm ci --no-audit --no-fund
      - name: Синтаксис
        if: steps.has.outputs.yes == '1'
        run: node --check "$PICKER"
      - name: Проверки стенда
        if: steps.has.outputs.yes == '1'
        run: echo "Проверяю $PICKER" && npm test
